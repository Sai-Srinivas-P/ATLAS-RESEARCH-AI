name: Build website slideshow

on:
  push:
    branches: [main]
    paths:
      - "assets/WEBSITE_RECORDING.mp4"
      - ".github/workflows/website-slideshow.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-slideshow
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pillow

      - name: Create high-resolution horizontal slideshow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-slides"
          input="assets/WEBSITE_RECORDING.mp4"
          # Crop away browser chrome, side margins, and the recording watermark.
          # The tighter crop enlarges the actual website UI in the README.
          vf="crop=1580:650:170:45,scale=1800:-1:flags=lanczos"

          ffmpeg -hide_banner -loglevel error -ss 249 -i "$input" -frames:v 1 -vf "$vf" "$RUNNER_TEMP/atlas-slides/01-home.png" -y
          ffmpeg -hide_banner -loglevel error -ss 8   -i "$input" -frames:v 1 -vf "$vf" "$RUNNER_TEMP/atlas-slides/02-chat.png" -y
          ffmpeg -hide_banner -loglevel error -ss 140 -i "$input" -frames:v 1 -vf "$vf" "$RUNNER_TEMP/atlas-slides/03-research.png" -y
          ffmpeg -hide_banner -loglevel error -ss 155 -i "$input" -frames:v 1 -vf "$vf" "$RUNNER_TEMP/atlas-slides/04-report.png" -y

          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image

          work = Path(os.environ["RUNNER_TEMP"]) / "atlas-slides"
          paths = [
              work / "01-home.png",
              work / "02-chat.png",
              work / "03-research.png",
              work / "04-report.png",
          ]
          slides = [Image.open(path).convert("RGB") for path in paths]
          width, height = slides[0].size
          if any(image.size != (width, height) for image in slides):
              raise RuntimeError("All slideshow screens must have matching dimensions.")

          # Create one shared 256-colour palette for all screens so colours
          # remain consistent across transitions.
          sample = Image.new("RGB", (1200, 488 * len(slides)), (5, 6, 5))
          for index, image in enumerate(slides):
              sample.paste(image.resize((1200, 488), Image.Resampling.LANCZOS), (0, index * 488))
          palette_image = sample.quantize(colors=256, method=Image.Quantize.MAXCOVERAGE)
          palette = palette_image.getpalette()
          palette_template = Image.new("P", (1, 1))
          palette_template.putpalette(palette)

          def indexed(image):
              return image.quantize(
                  palette=palette_template,
                  dither=Image.Dither.NONE,
              )

          frames = []
          durations = []
          transition_steps = 8

          for index, current in enumerate(slides):
              frames.append(indexed(current))
              durations.append(950)

              following = slides[(index + 1) % len(slides)]
              # Reverse the direction: the current screen exits left,
              # while the next screen enters from the right.
              for step in range(1, transition_steps + 1):
                  shift = round(width * step / transition_steps)
                  canvas = Image.new("RGB", (width, height), (5, 6, 5))
                  canvas.paste(current, (-shift, 0))
                  canvas.paste(following, (width - shift, 0))
                  frames.append(indexed(canvas))
                  durations.append(70)

          output = Path("assets/atlas-research-ai-slideshow-hq.gif")
          output.parent.mkdir(parents=True, exist_ok=True)
          frames[0].save(
              output,
              format="GIF",
              save_all=True,
              append_images=frames[1:],
              duration=durations,
              loop=0,
              disposal=2,
              optimize=False,
          )
          print(f"Created {output}: {width}x{height}, {len(frames)} frames, {output.stat().st_size:,} bytes")
          PY

      - name: Commit slideshow when it changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/atlas-research-ai-slideshow-hq.gif
          if git diff --cached --quiet; then
            echo "The slideshow is already up to date."
            exit 0
          fi
          git commit -m "Build reversed horizontal website slideshow"
          git pull --rebase origin main
          git push origin HEAD:main
